{{- if .Values.envSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperclip.envSecretName" . }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.envSecret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "paperclip.envSecretName" . }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "paperclip.envSecretName" . }}
    creationPolicy: Owner
  data:
    {{- required "externalSecret.data must list at least one key" .Values.externalSecret.data | toYaml | nindent 4 }}
{{- end }}
