apiVersion: v1
kind: Service
metadata:
  name: {{ include "paperclip.fullname" . }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- if .Values.service.selectorOverride }}
    {{- toYaml .Values.service.selectorOverride | nindent 4 }}
    {{- else }}
    {{- include "paperclip.selectorLabels" . | nindent 4 }}
    {{- end }}
