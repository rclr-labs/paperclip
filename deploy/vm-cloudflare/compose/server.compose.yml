# One colour of the T2 blue/green pair. Run as its own compose project:
#   PAPERCLIP_COLOR=blue  docker compose -p paperclip-blue  -f server.compose.yml up -d
#   PAPERCLIP_COLOR=green docker compose -p paperclip-green -f server.compose.yml up -d
# bin/bluegreen.sh drives this; do not flip the scheduler by hand.
#
# Extends docker/docker-compose.yml (same image, tini as PID 1, pids_limit,
# stop grace) for T1 on a VM: external Postgres, object storage, shared
# PAPERCLIP_HOME, no published public port (ingress is the Cloudflare tunnel
# through the router in edge.compose.yml).
name: paperclip-${PAPERCLIP_COLOR:?PAPERCLIP_COLOR must be blue or green}

services:
  server:
    image: ${PAPERCLIP_IMAGE:?PAPERCLIP_IMAGE must be set (repo@sha256:... preferred)}
    container_name: paperclip-${PAPERCLIP_COLOR}
    restart: unless-stopped
    pids_limit: 2048
    # Includes the shared 30s adapter-settlement window and final cleanup.
    stop_grace_period: 90s
    # Loopback only: the bluegreen script health-checks each colour directly.
    ports:
      - "127.0.0.1:${PAPERCLIP_HOST_PORT:?PAPERCLIP_HOST_PORT must be set}:3100"
    env_file:
      # DATABASE_URL, BETTER_AUTH_SECRET, PAPERCLIP_SECRETS_MASTER_KEY,
      # AWS_ACCESS_KEY_ID/SECRET (S3 or GCS HMAC), provider API keys.
      - path: ${PAPERCLIP_SECRETS_ENV_FILE:-/etc/paperclip/secrets.env}
        required: false
      # Storage / run-log settings written by Terraform (gcp vm variant) or by hand.
      - path: ${PAPERCLIP_INSTANCE_ENV_FILE:-/etc/paperclip/instance.env}
        required: false
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      # Behind Cloudflare Access the board is not on the open internet.
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_DEPLOYMENT_EXPOSURE:-private}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?PAPERCLIP_PUBLIC_URL must be set}
      # Machine hostname (Access bypass) handed to agents and remote runners.
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL:-}
      PAPERCLIP_RUNNER_PUBLIC_URL: ${PAPERCLIP_RUNNER_PUBLIC_URL:-}
      PAPERCLIP_CHAT_WEBHOOK_PUBLIC_URL: ${PAPERCLIP_CHAT_WEBHOOK_PUBLIC_URL:-}
      # private exposure rejects unknown Host headers; PUBLIC_URL's host is
      # implicit, the machine hostname must be listed.
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:-}
      # Default PASSIVE. Read at boot; only bin/bluegreen.sh turns it on, and
      # only after the other colour has stopped (§2 T2).
      HEARTBEAT_SCHEDULER_ENABLED: ${PAPERCLIP_SCHEDULER_ENABLED:-false}
      # The new image migrates at boot; keep migrations backward compatible
      # with the previous image for the blue/green window (§5).
      PAPERCLIP_MIGRATION_AUTO_APPLY: ${PAPERCLIP_MIGRATION_AUTO_APPLY:-true}
      PAPERCLIP_SECRETS_PROVIDER: ${PAPERCLIP_SECRETS_PROVIDER:-local_encrypted}
      PAPERCLIP_COLOR: ${PAPERCLIP_COLOR}
    volumes:
      # Shared by both colours: the server disk is the authoritative copy of
      # execution workspaces even for sandbox runs.
      - paperclip-home:/paperclip
    networks:
      - paperclip
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  paperclip-home:
    external: true
    name: ${PAPERCLIP_HOME_VOLUME:-paperclip-home}

networks:
  paperclip:
    external: true
    name: ${PAPERCLIP_NETWORK:-paperclip}
